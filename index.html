<style>
/* Layout: a flame-orange poster header, a strip of the restaurant's own posters, then clean
   text rows. Every category gets one drawn sticker in the same style.
   Single brand look (black, logo grey, flame orange) in every theme. */
:root {
  --bg: #111111;
  --surface: #1B1B1B;
  --ink: #F3F0EB;
  --muted: #A8A8A8;       /* logo grey */
  --line: #2E2E2E;
  --orange: #DE7325;      /* logo flame */
  --on-orange: #111111;
  --cream: #FFF6EA;
  --font-display: "Lalezar", "Rubik", system-ui, sans-serif;
  --font-body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Sign */
.sign { border-bottom: 3px solid var(--orange); }
.sign .wrap { padding-block: 18px 24px; display: grid; gap: 16px; }
.sign-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.place { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
[dir="rtl"] .place { letter-spacing: 0; }
.lang {
  font: 500 14px/1 var(--font-body); color: var(--ink);
  background: transparent; border: 1.5px solid var(--line); border-radius: 999px;
  padding: 8px 14px; cursor: pointer;
}
.brand { display: flex; align-items: center; gap: 16px; }
.badge {
  flex: none; width: 88px; height: 88px; border-radius: 16px;
  background: #FFFFFF; padding: 6px; display: grid; place-items: center;
}
.badge svg { width: 100%; height: 100%; display: block; }
.brand-text { min-width: 0; display: grid; gap: 4px; }
.wordmark {
  font-family: var(--font-display); font-weight: 400;
  font-size: clamp(40px, 12vw, 64px); line-height: .9; margin: 0;
  text-wrap: balance;
}
.motto { margin: 0; color: var(--orange); font-weight: 500; font-size: 17px; }


/* Info strip */
.info { display: flex; flex-wrap: wrap; gap: 6px 18px; padding-block: 14px; font-size: 14px; color: var(--muted); }
.info b { color: var(--ink); font-weight: 500; }

/* Photos strip */
.favs { padding-block: 10px 6px; }
.fav-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding-bottom: 12px; }
.fav-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 32px; line-height: 1; margin: 0; color: var(--ink); }
.fav-head p { margin: 0; color: var(--muted); font-size: 14px; }
.strip {
  --pad: max(16px, env(safe-area-inset-left, 0px), calc((100% - 528px) / 2));
  display: flex; gap: 12px; overflow-x: auto; padding: 0 var(--pad) 6px;
  scroll-snap-type: x proximity; scroll-padding-inline: var(--pad); scrollbar-width: none;
}
.strip::-webkit-scrollbar { display: none; }
.fav {
  flex: none; width: 216px; aspect-ratio: 4 / 5; border-radius: 16px; position: relative; overflow: hidden;
  scroll-snap-align: start; background: var(--orange); border: 1px solid var(--line);
}
.fav img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }

/* Tabs */
.tabs-bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line); margin-top: 14px;
}
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-block: 10px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a {
  flex: none; text-decoration: none; color: var(--ink);
  font-weight: 500; font-size: 15px; padding: 7px 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface);
}
.tabs a.on { background: var(--orange); border-color: var(--orange); color: var(--on-orange); }

.lang:focus-visible, .tabs a:focus-visible, .btn:focus-visible, .copy:focus-visible, .fav:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.tabs a:focus-visible, .copy:focus-visible { outline-color: var(--orange); }

/* Menu */
main .wrap { padding-block: 4px 24px; }
section.cat { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 64px); padding-block: 26px 4px; }
.sec-head { display: flex; align-items: center; gap: 14px; padding-bottom: 12px; border-bottom: 3px solid var(--orange); }
.stickers { display: flex; flex: none; }
.sticker-art {
  width: 58px; height: 58px; border-radius: 50%; background: var(--cream); border: 3px solid var(--orange);
  display: grid; place-items: center; padding: 2px; overflow: hidden;
}
.stickers .sticker-art + .sticker-art { margin-inline-start: -14px; }
.sticker-art svg { width: 100%; height: 100%; display: block; }
h2.cat-title { font-family: var(--font-display); font-weight: 400; font-size: 38px; line-height: 1; margin: 0; color: var(--ink); text-wrap: balance; }
.sec-note { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
.items { list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: 1fr auto; column-gap: 14px; row-gap: 2px; padding-block: 14px; border-bottom: 1px dashed var(--line); align-items: baseline; }
.item:last-child { border-bottom: 0; }
.item-name { font-weight: 600; font-size: 17px; min-width: 0; }
.item-desc { grid-column: 1; color: var(--muted); font-size: 14px; margin: 0; min-width: 0; }
.price { grid-row: 1; grid-column: 2; font-family: var(--font-display); font-size: 21px; line-height: 1.2; direction: ltr; white-space: nowrap; letter-spacing: .01em; }
.price.tbd { color: var(--muted); }
.tag {
  display: inline-block; margin-inline-start: 8px; vertical-align: 2px;
  font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--orange); border: 1px solid currentColor; border-radius: 4px; padding: 1px 6px;
}
[dir="rtl"] .tag { letter-spacing: 0; }

/* Order + footer */
.order { background: var(--surface); border-top: 1px solid var(--line); }
.order .wrap { padding-block: 28px; display: grid; gap: 14px; }
.order h3 { font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.05; margin: 0; }
.lines { display: grid; gap: 10px; }
.line {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
}
.line-label { font-size: 13px; color: var(--muted); }
.line-num { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; user-select: all; direction: ltr; unicode-bidi: embed; }
.line-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.copy {
  font: 500 14px/1 var(--font-body); color: var(--ink); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 9px 12px; cursor: pointer;
}
.btn {
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
  font-weight: 600; font-size: 15px; padding: 10px 16px; border-radius: 999px;
  background: var(--orange); color: var(--on-orange);
}
.thanks { background: var(--orange); color: var(--on-orange); }
.thanks .wrap { padding-block: 30px 38px; display: grid; gap: 14px; }
.thanks h3 { font-family: var(--font-display); font-weight: 400; font-size: 40px; line-height: .98; margin: 0; text-wrap: balance; }
.thanks p { margin: 0; max-width: 40ch; }
.thanks .btn { background: var(--on-orange); color: var(--ink); }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.thanks .fine { font-size: 12px; opacity: .8; }

@media (max-width: 380px) { .fav { width: 188px; } h2.cat-title { font-size: 34px; } }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head>

let lang = "en";
try { lang = localStorage.getItem("amins-lang") || ((navigator.language || "").startsWith("ar") ? "ar" : "en"); } catch (e) {}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = p => p == null ? null : p.toLocaleString("en-US") + (lang === "ar" ? " ل.ل" : " L.L");

function stickers(id) {
  const art = CATART[id] || [];
  return `<span class="stickers" aria-hidden="true">${art.map(a =>
    `<span class="sticker-art">${DRINK_ICONS[a] || a}</span>`).join("")}</span>`;
}

function render() {
  const T = TEXT[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.getElementById("lang").textContent = T.lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = T[el.dataset.t]; });

  document.getElementById("info").innerHTML =
    `<span><b>${T.hoursL}</b> ${esc(INFO.hours[lang])}</span><span><b>${T.servicesL}</b> ${esc(INFO.services[lang])}</span>`;

  document.getElementById("favs").innerHTML = POSTERS.length ? `
    <div class="wrap"><div class="fav-head"><h2>${esc(T.favs)}</h2><p>${esc(T.favsSub)}</p></div></div>
    <div class="strip">${POSTERS.map(p => `
      <a class="fav" href="#${p.to}"><img src="${esc(p.img)}" alt="${esc(p.alt[lang])}" loading="lazy"></a>`).join("")}</div>` : "";

  document.getElementById("tabs").innerHTML = MENU.map((s, i) =>
    `<a href="#${s.id}" data-id="${s.id}"${i === 0 ? ' class="on"' : ""}>${esc(s.name[lang])}</a>`).join("");

  document.getElementById("menu").innerHTML = MENU.map(s => `
    <section class="cat" id="${s.id}">
      <div class="sec-head">${stickers(s.id)}<h2 class="cat-title">${esc(s.name[lang])}</h2></div>
      ${s.note ? `<p class="sec-note">${esc(s.note[lang])}</p>` : ""}
      ${s.items.length ? `<ul class="items">${s.items.map(it => {
        const p = fmt(it.price);
        return `<li class="item">
          <span class="item-name">${esc(it.name[lang])}${it.tag ? `<span class="tag">${esc(T.tags[it.tag] || it.tag)}</span>` : ""}</span>
          <span class="price${p ? "" : " tbd"}">${p || "–"}</span>
          ${it.desc ? `<p class="item-desc">${esc(it.desc[lang])}</p>` : ""}
        </li>`; }).join("")}</ul>` : ""}
    </section>`).join("");
  watch();
}

let obs;
function watch() {
  if (obs) obs.disconnect();
  if (!("IntersectionObserver" in window)) return;
  obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      document.querySelectorAll(".tabs a").forEach(a => {
        const on = a.dataset.id === e.target.id;
        a.classList.toggle("on", on);
        if (on) { const bar = a.parentElement; bar.scrollTo({ left: a.offsetLeft - bar.clientWidth / 2 + a.clientWidth / 2 }); }
      });
    });
  }, { rootMargin: "-30% 0px -60% 0px" });
  document.querySelectorAll("main section").forEach(s => obs.observe(s));
}

document.getElementById("lang").addEventListener("click", () => {
  lang = lang === "en" ? "ar" : "en";
  try { localStorage.setItem("amins-lang", lang); } catch (e) {}
  render();
});

document.addEventListener("click", e => {
  const b = e.target.closest(".copy");
  if (!b) return;
  const done = () => { b.textContent = TEXT[lang].copied; setTimeout(() => { b.textContent = TEXT[lang].copy; }, 1500); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("tel-num")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  try { navigator.clipboard.writeText(b.dataset.copy).then(done, fallback); } catch (err) { fallback(); }
});

render();
</script>
