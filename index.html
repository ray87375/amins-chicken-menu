<style>
/* Layout: the brand's black sign with the logo badge, sticky category tabs,
   then one narrow column of menu rows (name … price) like a takeaway card.
   Single brand look (black, logo grey, flame orange) in every theme. */
:root {
  --bg: #111111;
  --surface: #1B1B1B;
  --ink: #F3F0EB;
  --muted: #A8A8A8;       /* logo grey */
  --line: #2E2E2E;
  --orange: #DE7325;      /* logo flame */
  --on-orange: #111111;
  --font-display: "Lalezar", "Rubik", system-ui, sans-serif;
  --font-body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Sign */
.sign { border-bottom: 3px solid var(--orange); }
.sign .wrap { padding-block: 18px 24px; display: grid; gap: 16px; }
.sign-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.place { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
[dir="rtl"] .place { letter-spacing: 0; }
.lang {
  font: 500 14px/1 var(--font-body); color: var(--ink);
  background: transparent; border: 1.5px solid var(--line); border-radius: 999px;
  padding: 8px 14px; cursor: pointer;
}
.brand { display: flex; align-items: center; gap: 16px; }
.badge {
  flex: none; width: 88px; height: 88px; border-radius: 16px;
  background: #FFFFFF; padding: 6px; display: grid; place-items: center;
}
.badge svg { width: 100%; height: 100%; display: block; }
.brand-text { min-width: 0; display: grid; gap: 4px; }
.wordmark {
  font-family: var(--font-display); font-weight: 400;
  font-size: clamp(40px, 12vw, 64px); line-height: .9; margin: 0;
  text-wrap: balance;
}
.motto { margin: 0; color: var(--orange); font-weight: 500; font-size: 17px; }

/* Info strip */
.info { display: flex; flex-wrap: wrap; gap: 8px 18px; padding-block: 14px; font-size: 14px; color: var(--muted); }
.info b { color: var(--ink); font-weight: 500; }

/* Tabs */
.tabs-bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-block: 10px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a {
  flex: none; text-decoration: none; color: var(--ink);
  font-weight: 500; font-size: 15px; padding: 7px 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface);
}
.tabs a.on { background: var(--orange); border-color: var(--orange); color: var(--on-orange); }

.lang:focus-visible, .tabs a:focus-visible, .btn:focus-visible, .copy:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

/* Menu */
main .wrap { padding-block: 8px 24px; }
section { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 64px); padding-block: 22px 6px; }
h2 {
  font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: 1;
  margin: 0 0 6px; color: var(--orange);
}
.sec-note { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
.items { list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: 60px 1fr auto; grid-template-rows: auto 1fr; column-gap: 14px; row-gap: 2px; padding-block: 12px; border-bottom: 1px dashed var(--line); align-items: start; }
.thumb {
  grid-row: 1 / span 2; grid-column: 1; width: 60px; height: 60px; border-radius: 12px;
  overflow: hidden; background: var(--surface); border: 1px solid var(--line);
  display: grid; place-items: center;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb svg { width: 22px; height: 22px; opacity: .55; }
.item:last-child { border-bottom: 0; }
.item-name { grid-column: 2; font-weight: 600; font-size: 17px; min-width: 0; padding-top: 2px; }
.item-desc { grid-column: 2 / 4; color: var(--muted); font-size: 14px; margin: 0; min-width: 0; }
.price { grid-row: 1; grid-column: 3; padding-top: 3px; font-size: 15px; font-weight: 600; direction: ltr; font-variant-numeric: tabular-nums; white-space: nowrap; }
.price.tbd { color: var(--muted); font-weight: 400; }
.tag {
  display: inline-block; margin-inline-start: 8px; vertical-align: 2px;
  font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--orange); border: 1px solid currentColor; border-radius: 4px; padding: 1px 6px;
}
[dir="rtl"] .tag { letter-spacing: 0; }

/* Order + footer */
.order { background: var(--surface); border-top: 1px solid var(--line); }
.order .wrap { padding-block: 28px; display: grid; gap: 14px; }
.order h3, .thanks h3 { font-family: var(--font-display); font-weight: 400; font-size: 28px; line-height: 1.05; margin: 0; }
.lines { display: grid; gap: 10px; }
.line {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
}
.line-label { font-size: 13px; color: var(--muted); }
.line-num { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; user-select: all; direction: ltr; unicode-bidi: embed; }
.line-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.copy {
  font: 500 14px/1 var(--font-body); color: var(--ink); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 9px 12px; cursor: pointer;
}
.btn {
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
  font-weight: 600; font-size: 15px; padding: 10px 16px; border-radius: 999px;
  background: var(--orange); color: var(--on-orange);
}
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.thanks .wrap { padding-block: 28px 36px; display: grid; gap: 14px; }
.thanks p { margin: 0; color: var(--muted); max-width: 40ch; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.fine { font-size: 12px; color: var(--muted); }

@media (max-width: 380px) { .badge { width: 72px; height: 72px; } .item { grid-template-columns: 52px 1fr auto; } .thumb { width: 52px; height: 52px; } }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head>

const FLAME = `<svg viewBox="0 0 24 24"><path fill="var(--muted)" d="M12 22c-4 0-6-2.6-5.3-5.8C7.4 13 10.3 10.6 12 3c1.7 7.6 4.6 10 5.3 13.2C18 19.4 16 22 12 22Z"/><path fill="var(--orange)" d="M12 20c-2.2 0-3.2-1.6-2.6-3.4.5-1.5 1.9-2.8 2.6-5.6.7 2.8 2.1 4.1 2.6 5.6.6 1.8-.4 3.4-2.6 3.4Z"/></svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = p => p == null ? null : p.toLocaleString("en-US") + (lang === "ar" ? " ل.ل" : " L.L");

function render() {
  const T = TEXT[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.getElementById("lang").textContent = T.lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = T[el.dataset.t]; });

  document.getElementById("info").innerHTML =
    `<span><b>${T.hoursL}</b> ${esc(INFO.hours[lang])}</span><span><b>${T.servicesL}</b> ${esc(INFO.services[lang])}</span>`;

  document.getElementById("tabs").innerHTML = MENU.map((s, i) =>
    `<a href="#${s.id}" data-id="${s.id}"${i === 0 ? ' class="on"' : ""}>${esc(s.name[lang])}</a>`).join("");

  document.getElementById("menu").innerHTML = MENU.map(s => `
    <section id="${s.id}">
      <h2>${esc(s.name[lang])}</h2>
      ${s.note ? `<p class="sec-note">${esc(s.note[lang])}</p>` : ""}
      ${s.items.length ? `<ul class="items">${s.items.map(it => {
        const p = fmt(it.price);
        const thumb = it.img
          ? `<span class="thumb"><img src="${esc(it.img)}" alt="" loading="lazy"></span>`
          : `<span class="thumb" aria-hidden="true">${FLAME}</span>`;
        return `<li class="item">
          ${thumb}
          <span class="item-name">${esc(it.name[lang])}${it.tag ? `<span class="tag">${esc(T.tags[it.tag] || it.tag)}</span>` : ""}</span>
          <span class="price${p ? "" : " tbd"}">${p || "–"}</span>
          ${it.desc ? `<p class="item-desc">${esc(it.desc[lang])}</p>` : ""}
        </li>`; }).join("")}</ul>` : ""}
    </section>`).join("");
  watch();
}

let obs;
function watch() {
  if (obs) obs.disconnect();
  if (!("IntersectionObserver" in window)) return;
  obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      document.querySelectorAll(".tabs a").forEach(a => {
        const on = a.dataset.id === e.target.id;
        a.classList.toggle("on", on);
        if (on) { const bar = a.parentElement; bar.scrollTo({ left: a.offsetLeft - bar.clientWidth / 2 + a.clientWidth / 2 }); }
      });
    });
  }, { rootMargin: "-30% 0px -60% 0px" });
  document.querySelectorAll("main section").forEach(s => obs.observe(s));
}

document.getElementById("lang").addEventListener("click", () => {
  lang = lang === "en" ? "ar" : "en";
  try { localStorage.setItem("amins-lang", lang); } catch (e) {}
  render();
});

document.addEventListener("click", e => {
  const b = e.target.closest(".copy");
  if (!b) return;
  const done = () => { b.textContent = TEXT[lang].copied; setTimeout(() => { b.textContent = TEXT[lang].copy; }, 1500); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("tel-num")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  try { navigator.clipboard.writeText(b.dataset.copy).then(done, fallback); } catch (err) { fallback(); }
});

render();
</script>

const FLAME = `<svg viewBox="0 0 24 24"><path fill="var(--muted)" d="M12 22c-4 0-6-2.6-5.3-5.8C7.4 13 10.3 10.6 12 3c1.7 7.6 4.6 10 5.3 13.2C18 19.4 16 22 12 22Z"/><path fill="var(--orange)" d="M12 20c-2.2 0-3.2-1.6-2.6-3.4.5-1.5 1.9-2.8 2.6-5.6.7 2.8 2.1 4.1 2.6 5.6.6 1.8-.4 3.4-2.6 3.4Z"/></svg>`;

          ${it.desc ? `<p class="item-desc">${esc(it.desc[lang])}</p>` : ""}
        </li>`; }).join("")}</ul>` : ""}
    </section>`).join("");
  watch();
}

let obs;
function watch() {
  if (obs) obs.disconnect();
  if (!("IntersectionObserver" in window)) return;
  obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      document.querySelectorAll(".tabs a").forEach(a => {
        const on = a.dataset.id === e.target.id;
        a.classList.toggle("on", on);
        if (on) { const bar = a.parentElement; bar.scrollTo({ left: a.offsetLeft - bar.clientWidth / 2 + a.clientWidth / 2 }); }
      });
    });
  }, { rootMargin: "-30% 0px -60% 0px" });
  document.querySelectorAll("main section").forEach(s => obs.observe(s));
}

document.getElementById("lang").addEventListener("click", () => {
  lang = lang === "en" ? "ar" : "en";
  try { localStorage.setItem("amins-lang", lang); } catch (e) {}
  render();
});

document.addEventListener("click", e => {
  const b = e.target.closest(".copy");
  if (!b) return;
  const done = () => { b.textContent = TEXT[lang].copied; setTimeout(() => { b.textContent = TEXT[lang].copy; }, 1500); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("tel-num")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  try { navigator.clipboard.writeText(b.dataset.copy).then(done, fallback); } catch (err) { fallback(); }
});

render();
</script>
